<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0A0A0A" />
    <script>
      (() => {
        let theme = 'dark';
        try {
          const savedTheme = localStorage.getItem('portfolio-theme');
          theme =
            savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (error) {
          console.warn('Unable to read the saved theme preference.', error);
        }

        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#F7F8FC' : '#0A0A0A';
      })();
    </script>

    <title>Matthew Martus — IT Student, Developer &amp; Project Manager</title>
    <meta
      name="description"
      content="Portfolio of Matthew Rimar Martus, a fourth-year BS Information Technology student at Cebu Institute of Technology – University. Open to UI/UX Design, Project Management, and Software Developer internships."
    />
    <meta name="author" content="Matthew Rimar Martus" />
    <meta
      name="keywords"
      content="Matthew Martus, Matthew Rimar Martus, CIT-U, Web Developer, UI/UX Design, Project Management, React, Django, Portfolio"
    />
